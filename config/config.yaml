# NullMarket central configuration.
# Environment-specific storage and cloud-execution settings live here so
# transformation logic does not need separate local-versus-GCP implementations.

application:
  name: NullMarket

# Keep local as the repository default so `python -m src.pipeline` continues to
# behave exactly like the existing development workflow. Managed Spark passes
# `--environment gcp` and the GCS paths as batch arguments at submission time.
environment: local

paths:
  # Repository-relative local paths used for development and pytest/local Spark.
  raw: data/raw
  curated: data/curated
  rejected: data/rejected

gcp:
  # Reuse the dedicated Phase 14 project and Toronto region.
  project_id: nullmarket-retail-de
  region: northamerica-northeast2

  gcs:
    bucket: nullmarket-retail-de-data

    # Authoritative cloud data-layer prefixes established in Phase 14.
    raw_uri: gs://nullmarket-retail-de-data/raw
    curated_uri: gs://nullmarket-retail-de-data/curated
    rejected_uri: gs://nullmarket-retail-de-data/rejected

    # Deployment artifacts are code/configuration, not a fourth data layer.
    # Keeping them outside raw/curated/rejected prevents code from being
    # mistaken for operational or analytical data.
    code_uri: gs://nullmarket-retail-de-data/code/phase15

  managed_spark:
    # Runtime 3.0 uses Spark 4.0.x, which is the closest managed runtime family
    # to the project's local PySpark 4.0.x environment.
    runtime_version: "3.0"

    # Dedicated non-human identity for the Spark workload. No key file is used;
    # the managed service attaches this identity directly to the batch.
    service_account: nullmarket-spark@nullmarket-retail-de.iam.gserviceaccount.com

  bigquery:
    # Dedicated analytical warehouse dataset created in Phase 16.
    dataset: nullmarket_warehouse
